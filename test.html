<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MCQ Quiz</title>

  <link rel="stylesheet" href="test.css">
</head>

<body>

  <div class="quiz-container">

    <!-- HEADER -->
    <div class="quiz-header">
      <h1>MCQ Quiz</h1>

      <div class="question-count">
        Question
        <span id="currentQuestion">1</span>
        /
        <span id="totalQuestions">15</span>
      </div>
    </div>


    <!-- TIMER -->
    <div class="timer-box">
      ⏱️ Time Left:
      <strong>
        <span id="timer">10</span>s
      </strong>
    </div>


    <!-- PROGRESS -->
    <div class="progress">
      <div id="progressBar"></div>
    </div>


    <!-- QUESTION -->
    <div class="question-box">

      <h2 id="question">
        Loading question...
      </h2>

      <div id="options"></div>

    </div>


    <!-- BUTTONS -->
    <div class="navigation">

      <button
        id="backBtn"
        class="nav-btn"
        type="button">
        ◀ Back
      </button>


      <button
        id="skipBtn"
        class="nav-btn"
        type="button">
        Skip
      </button>


      <button
        id="saveNextBtn"
        class="save-btn"
        type="button">
        Save & Next
      </button>

    </div>


    <!-- RESULT -->
    <div
      id="resultBox"
      class="result-box hidden">

      <h2>
        Quiz Complete 🎉
      </h2>

      <p>
        Your Score:
        <strong>
          <span id="score">0</span>
        </strong>
        /
        <strong>15</strong>
      </p>

      <button
        onclick="location.reload()"
        class="restart-btn"
        type="button">
        Restart Quiz
      </button>

    </div>

  </div>


  <!-- QUESTION FILES -->

  <script src="questions.js"></script>
  <script src="questions-math.js"></script>
  <script src="questions-science.js"></script>
  <script src="questions-social.js"></script>
  <script src="questions-english.js"></script>


  <!-- QUIZ JAVASCRIPT -->

  <script src="test.js"></script>

</body>
</html>
