<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MCQ Quiz</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="test.css">
</head>

<body>

  <div class="quiz-container">

    <h1>MCQ Quiz</h1>

    <div id="selection-screen">

      <h2>Which Subject MCQ You Want?</h2>

      <button onclick="selectSubject('science')">
        GENERAL SCIENCE
      </button>

      <button onclick="selectSubject('math')">
        MATHEMATICS
      </button>

      <button onclick="selectSubject('social')">
        SOCIAL SCIENCE
      </button>

      <button onclick="selectSubject('english')">
        ENGLISH
      </button>

      <button onclick="selectSubject('all')">
        ALL SUBJECTS
      </button>

    </div>


    <div id="class-screen" style="display:none;">

      <h2>Select Class</h2>

      <button onclick="startQuiz('9')">
        CLASS → 9TH
      </button>

      <button onclick="startQuiz('10')">
        CLASS → 10TH
      </button>

      <button onclick="startQuiz('11')">
        CLASS → 11TH
      </button>

      <button onclick="startQuiz('12')">
        CLASS → 12TH
      </button>

    </div>


    <div id="quiz-screen" style="display:none;">

      <div class="quiz-header">

        <span id="question-number">
          Question 1
        </span>

        <span id="score">
          Score: 0
        </span>

      </div>

      <h2 id="question">
        Question will appear here
      </h2>

      <div id="options"></div>

      <button id="next-btn" onclick="nextQuestion()" style="display:none;">
        NEXT
      </button>

    </div>


    <div id="result-screen" style="display:none;">

      <h2>Quiz Complete!</h2>

      <p id="final-score"></p>

      <button onclick="location.reload()">
        PLAY AGAIN
      </button>

    </div>

  </div>


  <!-- QUESTION FILES -->
  <script src="questions.js"></script>
  <script src="questions-math.js"></script>
  <script src="questions-science.js"></script>
  <script src="questions-social.js"></script>
  <script src="questions-english.js"></script>

  <!-- MAIN QUIZ JAVASCRIPT -->
  <script src="test.js"></script>

</body>
</html>
