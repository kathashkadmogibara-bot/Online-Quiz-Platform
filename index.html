<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCQ Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>MCQ QUIZ</h1>
    <p class="subtitle">Choose a subject to start</p>

    <section id="subjectMenu" class="menu">
      <h2>Which Subject MCQ You Want?</h2>

      <button class="subject-btn" data-subject="science">
        GENERAL SCIENCE
      </button>

      <button class="subject-btn" data-subject="math">
        MATHEMATICS
      </button>

      <button class="subject-btn" data-subject="social">
        SOCIAL SCIENCE
      </button>

      <button class="subject-btn" data-subject="english">
        ENGLISH
      </button>

      <button class="subject-btn" data-subject="all">
        ALL SUBJECTS
      </button>
    </section>

    <section id="classMenu" class="menu hidden">
      <h2>Choose Your Class</h2>

      <button class="class-btn" data-class="9">CLASS → 9TH</button>
      <button class="class-btn" data-class="10">CLASS → 10TH</button>
      <button class="class-btn" data-class="11">CLASS → 11TH</button>
      <button class="class-btn" data-class="12">CLASS → 12TH</button>

      <button id="backSubject" class="back-btn">
        ← Back
      </button>
    </section>

  </div>

  <script src="questions.js"></script>
  <script src="questions-math.js"></script>
  <script src="questions-science.js"></script>
  <script src="questions-social.js"></script>
  <script src="questions-english.js"></script>
  <script src="test.js"></script>

</body>
</html>
