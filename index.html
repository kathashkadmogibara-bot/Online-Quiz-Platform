<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCQ Quiz</title>
  <link rel="stylesheet" href="test.css">
</head>

<body>

  <div class="quiz-container">

    <div class="quiz-header">
      <h1>MCQ Quiz</h1>
      <div class="question-count">
        Question <span id="currentQuestion">1</span> / <span id="totalQuestions">15</span>
      </div>
    </div>

    <div class="timer-box">
      ⏱️ Time Left:
      <strong><span id="timer">10</span>s</strong>
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <div class="question-box">
      <h2 id="question">Loading question...</h2>

      <div id="options"></div>
    </div>

    <div class="navigation">

      <button id="backBtn" class="nav-btn">
        ◀ Back
      </button>

      <button id="skipBtn" class="nav-btn">
        Skip
      </button>

      <button id="saveNextBtn" class="save-btn">
        Save & Next
      </button>

    </div>

    <div id="resultBox" class="result-box hidden">
      <h2>Quiz Complete 🎉</h2>

      <p>
        Your Score:
        <strong><span id="score">0</span></strong>
        /
        <strong>15</strong>
      </p>

      <button onclick="location.reload()" class="restart-btn">
        Restart Quiz
      </button>
    </div>

  </div>

  <script src="test.js"></script>

</body>
</html>
